"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$package\
$cmd_duration\
$character"""

add_newline = false

[directory]
truncation_length = 0
truncate_to_repo = false

[nodejs]
format = "[$symbol($version )]($style)"

[cmd_duration]
min_time = 500
format = "[$duration]($style) "
