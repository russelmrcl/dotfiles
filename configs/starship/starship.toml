"$schema" = 'https://starship.rs/config-schema.json'

format = """$directory$git_branch$git_status$nodejs$package$docker_context$cmd_duration$character"""

add_newline = false

[directory]
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = "\uf126 "
format = "[$symbol$branch]($style) "

[git_status]
format = "[$all_status$ahead_behind]($style) "
conflicted = "="
ahead = "↑${count}"
behind = "↓${count}"
diverged = "⇕"
modified = "\ueb65 "
staged = "+${count}"
untracked = "?"

[nodejs]
symbol = "\ue718 "
format = "[$symbol$version]($style) "

[package]
symbol = "\uf487 "
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 500
format = "[$duration]($style) "

[character]
success_symbol = "[❯]()"
error_symbol = "[✗]()"
